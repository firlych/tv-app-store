
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV APP STORE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:#fff;
 font-family:Arial,sans-serif;padding:24px
}
header{display:flex;align-items:center;gap:12px}
.logo{
 background:#2563eb;padding:13px;border-radius:13px;
 font-size:23px
}
h1{font-size:23px}
.sub{color:#94a3b8;font-size:13px}
.search{
 width:100%;padding:15px;margin:24px 0;
 border:1px solid #334155;border-radius:12px;
 background:#1e293b;color:white;font-size:15px
}
.grid{display:grid;grid-template-columns:
 repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{
 background:#1e293b;border:1px solid #334155;
 border-radius:16px;padding:18px
}
.icon{
 width:55px;height:55px;border-radius:13px;
 background:#334155;display:grid;place-items:center;
 font-size:27px;margin-bottom:14px
}
.name{font-size:19px;font-weight:bold}
.desc{color:#94a3b8;font-size:13px;min-height:35px}
button{
 border:0;background:#2563eb;color:white;
 padding:12px 20px;border-radius:9px;
 font-weight:bold;cursor:pointer
}
button:disabled{background:#475569}
footer{margin-top:35px;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>
 <div class="logo">▶</div>
 <div>
  <h1>TV APP STORE</h1>
  <div class="sub">Aplikasi Android TV dan Android</div>
 </div>
</header>

<input id="search" class="search"
 placeholder="Cari aplikasi..." oninput="render()">

<div id="status" class="sub">Memuat katalog...</div>
<div id="apps" class="grid"></div>

<footer>TV APP STORE · Official App Catalog</footer>

<script>
let catalog=[];

async function loadCatalog(){
 try{
  const response=await fetch('catalog/apps.json?t='+Date.now());
  if(!response.ok)throw Error('Katalog tidak ditemukan');
  const data=await response.json();
  catalog=data.apps||[];
  document.getElementById('status').textContent=
   catalog.length+' aplikasi tersedia';
  render();
 }catch(e){
  document.getElementById('status').textContent=
   'Gagal memuat katalog: '+e.message;
 }
}

function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const area=document.getElementById('apps');
 area.innerHTML='';
 catalog.filter(a=>a.enabled&&
  (a.name+' '+a.description).toLowerCase().includes(q)
 ).forEach(a=>{
  const card=document.createElement('div');
  card.className='card';
  const icon=document.createElement('div');
  icon.className='icon';
  icon.textContent='📺';
  const name=document.createElement('div');
  name.className='name';
  name.textContent=a.name;
  const desc=document.createElement('p');
  desc.className='desc';
  desc.textContent=a.description+' · Versi '+a.version;
  const btn=document.createElement('button');
  btn.textContent=a.apkUrl?'DOWNLOAD':'BELUM TERSEDIA';
  btn.disabled=!a.apkUrl;
  btn.onclick=()=>window.open(a.apkUrl,'_blank','noopener');
  card.append(icon,name,desc,btn);
  area.append(card);
 });
}

loadCatalog();
</script>
</body>
</html>
